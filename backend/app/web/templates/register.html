{% extends "base.html" %}
{% block title %}Register · {{ app_name }}{% endblock %}
{% block content %}
<section class="hero-block compact">
  <p class="eyebrow">Free account</p>
  <h1>Register</h1>
  <p class="lede">Create your manager profile, then build your team.</p>
</section>
<form class="panel stack soft-form" method="post" action="/register">
  <label>User name
    <input name="display_name" required maxlength="80" placeholder="Manuel" autocomplete="username" />
  </label>
  <label>Password
    <input name="password" type="password" required minlength="6" maxlength="128" autocomplete="new-password" />
  </label>
  <label>Email
    <input name="email" type="email" required maxlength="120" placeholder="you@email.com" autocomplete="email" />
  </label>
  <label>Team’s name
    <input name="team_name" required maxlength="80" placeholder="Forge FC" autocomplete="organization" />
  </label>
  <button class="btn" type="submit">Create account</button>
</form>
<p class="auth-links muted">
  Already registered? <a href="/login">Sign in</a>
</p>
{% endblock %}
