{% extends "base.html" %}
{% block title %}Fut Fantasy{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<script>document.documentElement.setAttribute("data-theme", "dark");</script>
<div class="auth-stage auth-splash">
  <div class="auth-brand">
    <img class="auth-logo-mark" src="/static/icons/logo.svg" width="72" height="72" alt="" />
    <h1 class="auth-logo"><span class="auth-logo-fut">Fut</span> Fantasy</h1>
    <p class="auth-tagline">Your team. Your strategy. Your glory.</p>
  </div>

  <form class="auth-card stack" method="post" action="/register">
    <p class="auth-card-title">Create account</p>
    <label class="auth-field">User name
      <input name="display_name" required maxlength="80" placeholder="" autocomplete="username" />
    </label>
    <label class="auth-field">Password
      <span class="auth-password-wrap">
        <input name="password" type="password" required minlength="6" maxlength="128" autocomplete="new-password" />
        <button type="button" class="icon-btn auth-password-toggle" aria-label="Show password" aria-pressed="false" title="Show password">👁</button>
      </span>
    </label>
    <label class="auth-field">Confirm password
      <span class="auth-password-wrap">
        <input name="password_confirm" type="password" required minlength="6" maxlength="128" autocomplete="new-password" />
        <button type="button" class="icon-btn auth-password-toggle" aria-label="Show password" aria-pressed="false" title="Show password">👁</button>
      </span>
    </label>
    <label class="auth-field">Email
      <input name="email" type="email" required maxlength="120" placeholder="you@email.com" autocomplete="email" />
    </label>
    <label class="auth-field">Team’s name
      <input name="team_name" maxlength="80" placeholder="Optional — you can set this later" autocomplete="organization" />
    </label>
    <button class="btn auth-primary" type="submit">Create account</button>
    <a class="auth-text-link auth-secondary-link" href="/">Back to sign in</a>
  </form>
</div>
{% endblock %}
