{% extends "base.html" %}
{% block title %}Recover password · {{ app_name }}{% endblock %}
{% block content %}
<section class="hero-block compact">
  <p class="eyebrow">Account help</p>
  <h1>Recover password</h1>
  <p class="lede">Enter the email you used when registering.</p>
</section>
<form class="panel stack soft-form" method="post" action="/forgot-password">
  <label>Email
    <input name="email" type="email" required maxlength="120" placeholder="you@email.com" autocomplete="email" />
  </label>
  <button class="btn" type="submit">Send reset link</button>
</form>
{% if reset_url %}
<section class="panel soft">
  <p class="muted tiny">Reset link (valid ~2 hours):</p>
  <p><a href="{{ reset_url }}">{{ reset_url }}</a></p>
</section>
{% endif %}
<p class="auth-links muted">
  <a href="/login">Back to sign in</a>
</p>
{% endblock %}
