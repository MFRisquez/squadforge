{% extends "base.html" %}
{% block title %}{{ app_name }}{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-brand">
    <span class="auth-brand-mark"></span>
    <h1 class="auth-logo">{{ app_name }}</h1>
  </div>

  <form class="auth-card stack" method="post" action="/reset-password">
    <p class="auth-card-title">New password</p>
    <p class="auth-card-lede">Choose a new password for your FutFantasy account.</p>
    <input type="hidden" name="token" value="{{ token }}" />
    <label class="auth-field">New password
      <input name="password" type="password" required minlength="6" maxlength="128" autocomplete="new-password" />
    </label>
    <label class="auth-field">Confirm password
      <input name="password_confirm" type="password" required minlength="6" maxlength="128" autocomplete="new-password" />
    </label>
    <button class="btn auth-primary" type="submit">Update password</button>
    <a class="auth-text-link auth-secondary-link" href="/login">Back to sign in</a>
  </form>
</div>
{% endblock %}
