{% extends "base.html" %}
{% block title %}Reset password · {{ app_name }}{% endblock %}
{% block content %}
<section class="hero-block compact">
  <p class="eyebrow">Account help</p>
  <h1>New password</h1>
  <p class="lede">Choose a new password for your SquadForge account.</p>
</section>
<form class="panel stack soft-form" method="post" action="/reset-password">
  <input type="hidden" name="token" value="{{ token }}" />
  <label>New password
    <input name="password" type="password" required minlength="6" maxlength="128" autocomplete="new-password" />
  </label>
  <label>Confirm password
    <input name="password_confirm" type="password" required minlength="6" maxlength="128" autocomplete="new-password" />
  </label>
  <button class="btn" type="submit">Update password</button>
</form>
<p class="auth-links muted">
  <a href="/login">Back to sign in</a>
</p>
{% endblock %}
