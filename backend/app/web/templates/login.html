{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block content %}
<section class="hero-block compact">
  <p class="eyebrow">Welcome</p>
  <h1>Sign in</h1>
  <p class="lede">Free for your friends league. Use the account you registered.</p>
</section>
<form class="panel stack soft-form" method="post" action="/login">
  <label>User name or email
    <input name="login" required maxlength="120" placeholder="Manuel or you@email.com" autocomplete="username" />
  </label>
  <label>Password
    <input name="password" type="password" required minlength="4" maxlength="128" autocomplete="current-password" />
  </label>
  <button class="btn" type="submit">Sign in</button>
</form>
<p class="auth-links muted">
  <a href="/register">Create an account</a>
  ·
  <a href="/forgot-password">Recover password</a>
</p>
{% endblock %}
