{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block content %}
<section class="hero-block compact">
  <p class="eyebrow">Welcome</p>
  <h1>Sign in</h1>
  <p class="lede">New name creates your manager. Use the same PIN next time.</p>
</section>
<form class="panel stack soft-form" method="post" action="/login">
  <label>Your name
    <input name="display_name" required maxlength="80" placeholder="Manuel" autocomplete="username" />
  </label>
  <label>PIN (min 4 chars)
    <input name="pin" type="password" required minlength="4" maxlength="16" autocomplete="current-password" />
  </label>
  <label>Team name (optional)
    <input name="team_name" maxlength="80" placeholder="Forge FC" />
  </label>
  <button class="btn" type="submit">Continue</button>
</form>
{% endblock %}
