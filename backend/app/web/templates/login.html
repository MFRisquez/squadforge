{% extends "base.html" %}
{% block title %}{{ app_name }}{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-brand" aria-hidden="false">
    <span class="auth-brand-mark"></span>
    <h1 class="auth-logo">{{ app_name }}</h1>
  </div>

  <form class="auth-card stack" method="post" action="/login">
    <label class="auth-field">Username
      <input name="login" required maxlength="120" placeholder="Username or email" autocomplete="username" />
    </label>
    <label class="auth-field">Password
      <input name="password" type="password" required minlength="4" maxlength="128" autocomplete="current-password" />
    </label>
    <a class="auth-text-link" href="/forgot-password">Recover password</a>
    <button class="btn auth-primary" type="submit">Sign in</button>
    <a class="auth-text-link auth-secondary-link" href="/register">Create account</a>
  </form>
</div>
{% endblock %}
