# FutFantasy on Render — web service only.
# Database: use free Supabase Postgres (see README). Paste DATABASE_URL in Render Environment.
# Deploy: https://render.com/deploy?repo=https://github.com/MFRisquez/squadforge
# Branch: cursor/supabase-database-9855

services:
  - type: web
    name: futfantasy
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      # Paste Supabase URI (Session pooler, port 5432) — required for accounts to survive redeploys
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Advanced Fixtures sheet stats (possession, SOT, passes). Free tier at api-football.com
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_SEASON
        value: "2026"
