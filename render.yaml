# Free Render blueprint — stable HTTPS URL + Postgres so accounts survive redeploys.
# Deploy: https://render.com/deploy?repo=https://github.com/MFRisquez/squadforge
# Branch: cursor/persist-render-database-9855 (until merged)

databases:
  - name: squadforge-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: squadforge
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: squadforge-db
          property: connectionString
