# Free Render blueprint — stable HTTPS URL for phone + computer.
# Deploy: https://render.com/deploy?repo=https://github.com/MFRisquez/squadforge
# Branch: cursor/auth-register-permanent-url-9855 (until merged to main)

services:
  - type: web
    name: squadforge
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      # Optional — set after first deploy to your real URL, e.g. https://squadforge.onrender.com
      - key: PUBLIC_BASE_URL
        value: ""
